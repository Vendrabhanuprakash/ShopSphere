{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ShopSphere{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- ShopSphere Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<div class="auth-page">

    <!-- ========== LEFT SIDE: Welcome / Illustration ========== -->
    <div class="auth-left">
        <div class="auth-illustration">
            <i class="bi bi-globe2"></i>
        </div>
        <h1>Welcome to <br><span style="color: var(--accent);">ShopSphere</span></h1>
        <p>
            Enter a premium shopping ecosystem. Connect with high-quality electronics, modern apparel, curated books, and luxury products.
        </p>
    </div>

    <!-- ========== RIGHT SIDE: Form Card ========== -->
    <div class="auth-right">
        {% block auth_content %}
        {% endblock %}
    </div>

</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="{% static 'js/main.js' %}"></script>

</body>
</html>
